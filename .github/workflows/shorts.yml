name: Shorts Factory
on:
  schedule:
    - cron: "41 8 * * *"
    - cron: "11 15 * * *"
  workflow_dispatch:
    inputs:
      sadece_ses_testi:
        description: "Sadece ses testi (video yapma, YouTube'a yükleme)"
        type: boolean
        default: false
      sadece_instagram_testi:
        description: "Sadece Instagram testi (son videoyu Instagram'a gönder)"
        type: boolean
        default: false
permissions:
  contents: write
  issues: write
  models: read
concurrency: shorts
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - name: Sadece Instagram testi
        if: ${{ inputs.sadece_instagram_testi }}
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USERNAME: ${{ vars.IG_USERNAME }}
          IG_AI_LABEL: ${{ vars.IG_AI_LABEL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python ig_testi.py
      - name: Sadece ses testi
        if: ${{ inputs.sadece_ses_testi }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_VOICE: ${{ vars.GEMINI_TTS_VOICE }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          GOOGLE_TTS_VOICE: ${{ vars.GOOGLE_TTS_VOICE }}
          CHIRP_TEMPO: ${{ vars.SES_HIZI }}
        run: python ses_testi.py
      - name: Ses dosyasini indirilebilir yap
        if: ${{ inputs.sadece_ses_testi }}
        uses: actions/upload-artifact@v4
        with:
          name: ses-testi
          path: ses_testi/*.mp3
      - name: Video uret ve yukle
        if: ${{ !inputs.sadece_ses_testi && !inputs.sadece_instagram_testi }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YT_UPLOAD: ${{ vars.YT_UPLOAD }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          GOOGLE_TTS_VOICE: ${{ vars.GOOGLE_TTS_VOICE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_VOICE: ${{ vars.GEMINI_TTS_VOICE }}
          CHIRP_TEMPO: ${{ vars.SES_HIZI }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USERNAME: ${{ vars.IG_USERNAME }}
          # Instagram'a günde 1 video: sadece akşam (18:11 TR) çalışmasının videosu gider
          IG_UPLOAD: ${{ (github.event.schedule == '11 15 * * *' && vars.IG_UPLOAD != '0') && '1' || '0' }}
          IG_AI_LABEL: ${{ vars.IG_AI_LABEL }}
        run: python autopilot.py
      - name: Durumu kaydet
        if: ${{ always() && !inputs.sadece_ses_testi && !inputs.sadece_instagram_testi }}
        run: |
          git config user.name "shorts-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state topics topics_queue.txt
          git commit -m "durum guncellendi" || true
          git push || true
      - name: Senaryo sayisini kontrol et
        if: ${{ always() && !inputs.sadece_ses_testi && !inputs.sadece_instagram_testi }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python senaryo_uyarisi.py || true
      - name: Instagram anahtarini yenile (gunde bir)
        if: ${{ github.event.schedule == '41 8 * * *' }}
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USERNAME: ${{ vars.IG_USERNAME }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python ig_anahtar_yenile.py || true
