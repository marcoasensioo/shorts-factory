name: Shorts Factory
on:
  schedule:
    - cron: "41 8 * * *"
    - cron: "11 15 * * *"
  workflow_dispatch:
permissions:
  contents: write
  models: read
concurrency: shorts
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - name: Video uret ve yukle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YT_UPLOAD: ${{ vars.YT_UPLOAD }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          GOOGLE_TTS_VOICE: ${{ vars.GOOGLE_TTS_VOICE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_VOICE: ${{ vars.GEMINI_TTS_VOICE }}
          CHIRP_TEMPO: ${{ vars.SES_HIZI }}
        run: python autopilot.py
      - name: Durumu kaydet
        if: always()
        run: |
          git config user.name "shorts-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state topics topics_queue.txt
          git commit -m "durum guncellendi" || true
          git push || true
