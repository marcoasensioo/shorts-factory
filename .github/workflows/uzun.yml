name: Uzun Belgesel
on:
  schedule:
    - cron: "23 9 * * 0"   # her pazar ~12:23 (TR)
  workflow_dispatch:
permissions:
  contents: write
concurrency: shorts
jobs:
  uzun:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - name: Uzun video uret ve yukle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YT_UPLOAD: ${{ vars.YT_UPLOAD }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_VOICE: ${{ vars.GEMINI_TTS_VOICE }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          CHIRP_TEMPO: ${{ vars.SES_HIZI }}
          RENDER_WORKERS: "4"
        run: python uzun_video.py
      - name: Durumu kaydet
        if: always()
        run: |
          git config user.name "shorts-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state long_topics
          git commit -m "uzun video durumu" || true
          git pull --rebase || true
          git push || true
